#191;Firebase inicializo?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="136.9336" x="361.8748" y="286.4141">(hay google-services.json)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="13.8223" x="336.0525" y="270.4531">no</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="7.998" x="510.8083" y="270.4531">si</text><path d="M196.8018,299.4258 L196.8018,332.3477 L176.8018,336.3477 L196.8018,340.3477 L196.8018,373.2695 A0,0 0 0 0 196.8018,373.2695 L434.3467,373.2695 A0,0 0 0 0 434.3467,373.2695 L434.3467,309.4258 L424.3467,299.4258 L196.8018,299.4258 A0,0 0 0 0 196.8018,299.4258" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M424.3467,299.4258 L424.3467,309.4258 L434.3467,309.4258 L424.3467,299.4258" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="101.8594" x="202.8018" y="317.375">La aplicacion opera</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="99.7383" x="307.9482" y="317.375">solo contra Room</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="2.6016" x="407.6865" y="317.375">,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="212.4902" x="202.8018" y="333.3359">exactamente como antes de tener nube.</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216.5449" x="202.8018" y="349.2969">Sin este camino, la falta de configuracion</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="106.9922" x="202.8018" y="365.2578">romperia la entrega.</text><rect fill="#E8F1FB" height="35.9609" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="142.1328" x="34.6689" y="318.3672"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="122.1328" x="44.6689" y="341.3164">Motor de replica = null</text><rect fill="#E8F1FB" height="35.9609" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="189.4707" x="11" y="399.2305"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="169.4707" x="21" y="422.1797">Sembrar datos de demostracion</text><rect fill="#E8F1FB" height="67.8828" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="183.3945" x="663.2505" y="299.4258"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="106.6523" x="673.2505" y="322.375">Preguntar a la nube:</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="163.3945" x="673.2505" y="338.3359">&#191;este usuario ya tiene cuentas?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="157.9043" x="673.2505" y="354.2969">(Source.SERVER, tope de 12 s)</text><polygon fill="#FDF3E3" points="729.4858,393.2695,780.4097,393.2695,792.4097,405.2695,780.4097,417.2695,729.4858,417.2695,717.4858,405.2695,729.4858,393.2695" style="stroke:#E0A32E;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="50.9238" x="729.4858" y="410.2383">respuesta</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="105.7441" x="611.7417" y="402.2578">la nube TIENE datos</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="134.3086" x="792.4097" y="402.2578">vacia, o no se pudo saber</text><path d="M601.6006,427.2695 L601.6006,460.1914 L581.6006,464.1914 L601.6006,468.1914 L601.6006,501.1133 A0,0 0 0 0 601.6006,501.1133 L865.0498,501.1133 A0,0 0 0 0 865.0498,501.1133 L865.0498,437.2695 L855.0498,427.2695 L601.6006,427.2695 A0,0 0 0 0 601.6006,427.2695" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M855.0498,427.2695 L855.0498,437.2695 L865.0498,437.2695 L855.0498,427.2695" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="230.4785" x="607.6006" y="445.2188">Sembrar aqui era el error: el telefono nuevo</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="241.2891" x="607.6006" y="461.1797">creaba sus 10 cuentas y ademas bajaba las 10</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="242.4492" x="607.6006" y="477.1406">de la nube. 20 cuentas duplicadas, y lo mismo</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="126.6211" x="607.6006" y="493.1016">con las otras tres tablas.</text><rect fill="#E8F1FB" height="35.9609" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="117.2539" x="464.3467" y="446.2109"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="97.2539" x="474.3467" y="469.1602">No sembrar nada</text><rect fill="#E8F1FB" height="51.9219" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="203.7441" x="885.0498" y="427.2695"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="183.7441" x="895.0498" y="450.2188">Sembrar 10 cuentas, 10 categorias,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170.6777" x="895.0498" y="466.1797">10 movimientos y 10 pagos fijos</text><path d="M1096.791,511.1133 L1096.791,552.0156 L1076.791,556.0156 L1096.791,560.0156 L1096.791,600.918 A0,0 0 0 0 1096.791,600.918 L1347.2324,600.918 A0,0 0 0 0 1347.2324,600.918 L1347.2324,521.1133 L1337.2324,511.1133 L1096.791,511.1133 A0,0 0 0 0 1096.791,511.1133" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M1337.2324,511.1133 L1337.2324,521.1133 L1347.2324,521.1133 L1337.2324,511.1133" fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="217.9922" x="1102.791" y="529.0625">El uuid fijo hace inofensiva una siembra a</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="198.8086" x="1102.791" y="545.0234">ciegas: si la nube ya tenia esas filas, la</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="52.7344" x="1102.791" y="560.9844">bajada las</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49.6289" x="1158.8125" y="560.9844">actualiza</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="103.5703" x="1211.7285" y="560.9844">en vez de anadirlas.</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="229.4414" x="1102.791" y="576.9453">La fecha en el pasado impide que la semilla</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="150.4219" x="1102.791" y="592.9063">pise una edicion del usuario.</text><rect fill="#E8F1FB" height="67.8828" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="179.7383" x="897.0527" y="522.0742"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="23.5547" x="907.0527" y="545.0234">uuid</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="18.7559" x="933.8945" y="545.0234">fijo</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="110.8535" x="955.9375" y="545.0234">derivado del nombre</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="124.7227" x="907.0527" y="560.9844">(demo-cuenta-efectivo)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127.0898" x="907.0527" y="576.9453">y fecha fija en el pasado</text><polygon fill="#FDF3E3" points="754.9478,606.918,766.9478,618.918,754.9478,630.918,742.9478,618.918,754.9478,606.918" style="stroke:#E0A32E;stroke-width:0.5;"/><polygon fill="#FDF3E3" points="430.3416,636.918,442.3416,648.918,430.3416,660.918,418.3416,648.918,430.3416,636.918" style="stroke:#E0A32E;stroke-width:0.5;"/><rect fill="#E8F1FB" height="51.9219" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="191.6621" x="334.5105" y="680.918"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="171.6621" x="344.5105" y="703.8672">Programar RecordatoriosWorker</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="157.957" x="344.5105" y="719.8281">(revision diaria de pagos fijos)</text><rect fill="#E8F1FB" height="51.9219" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="190.3086" x="335.1873" y="752.8398"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170.3086" x="345.1873" y="775.7891">Programar SincronizadorWorker</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="126.3281" x="345.1873" y="791.75">(cada 15 min, exige red)</text><rect fill="#E8F1FB" height="35.9609" rx="3" ry="3" style="stroke:#35506B;stroke-width:0.5;" width="176.3457" x="342.1687" y="824.7617"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="156.3457" x="352.1687" y="847.7109">Revisar pagos vencidos ahora</text><ellipse cx="430.3416" cy="891.7227" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="430.3416" cy="891.7227"